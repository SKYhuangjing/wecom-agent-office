name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # 钉 ubuntu-24.04：ubuntu-latest 将于 2026-10 滚到 Ubuntu 26，钉死避免
    # 镜像在我们不知情时切换（CI 可复现）。
    runs-on: ubuntu-24.04
    steps:
      # v5 原生 node24（v4 target node20 会被 runner 强制跑 node24 并报弃用）。
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 全量测试（node --test）
        run: npm test

      - name: provider 契约（fake-bin 套件 ×5）
        run: |
          set -e
          for p in dsh claude codex pi cursor; do
            echo "== contract: provider-$p =="
            npm run contract -- --plugin "plugins/provider-$p"
          done

      - name: 汇总
        if: failure()
        run: echo "::error::测试或契约未全绿——对照 README §5 测试矩阵本地复跑"
