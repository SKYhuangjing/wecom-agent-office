<!doctype html>
<!-- ui-workbench harness (M3 T2 截图工作流, kernel-hosted same-origin):
     ?page=workbench (default) renders 工作台, ?page=bots renders Bot 管理.
     Swap fake-data.js entries for the state you want to screenshot (empty
     list, offline bot with a reason, save-error state...), then:
       chrome --headless=new --disable-gpu --screenshot=list-light.png \
         --window-size=1280,800 http://127.0.0.1:8792/api/ui/ui-workbench/harness.html
       chrome ... --screenshot=bots-light.png \
         http://127.0.0.1:8792/api/ui/ui-workbench/harness.html?page=bots
     and again with --force-dark-mode for the dark pair. -->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>harness · ui-workbench</title>
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body>
  <div id="root"></div>
  <script src="/vendor/react.umd.js"></script>
  <script src="/vendor/react-dom.umd.js"></script>
  <script type="module">
    import { makeWAOStub } from '/assets/harness-lib/wao-stub.js';
    import { FAKE, FAKE_API } from './fake-data.js';
    const stub = makeWAOStub({ agents: FAKE.agents, api: FAKE_API });
    const index = await import('./index.js'); // registers workbench + bots via the collector
    const wanted = new URLSearchParams(location.search).get('page');
    const page = [index.default, ...stub.pages].find((p) => p.id === wanted) ?? index.default;
    stub.render(page, document.getElementById('root'));
  </script>
</body>
</html>
