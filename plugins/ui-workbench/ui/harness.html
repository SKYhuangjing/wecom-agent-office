<!doctype html>
<!-- ui-workbench harness (M3 T2/T3 截图工作流, W3 T4 增资产科, v2 增向导步直达,
     kernel-hosted same-origin): ?page=workbench (default) renders 工作台; also
     bots / assets / session / push / plugins / timeline. assets 页 ?view=equip
     直达装备台（&bot=<id> 选同事）。bots 页 ?select=new 打开入职向导，&step=N
     (1-5) 直达第 N 步——第 3 步配发装备/第 5 步通信渠道的基线用。
     ?state=empty (no bots) / ?state=error (服务断联的 fetch 失败文案)
     swap the fake data for those boundary states — test/ui-shot.sh 截空态/错误态
     基线用. Swap fake-data.js entries for the state you want to screenshot
     (empty ledger, offline bot, failed plugin, push error...), then:
       chrome --headless=new --disable-gpu --screenshot=list-light.png \
         --window-size=1280,800 http://127.0.0.1:8792/api/ui/ui-workbench/harness.html
       chrome ... --screenshot=session-light.png \
         http://127.0.0.1:8792/api/ui/ui-workbench/harness.html?page=session
     and again with --force-dark-mode for the dark pair of each page. -->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>harness · ui-workbench</title>
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body>
  <div id="root"></div>
  <script src="/vendor/react.umd.js"></script>
  <script src="/vendor/react-dom.umd.js"></script>
  <script type="module">
    import { makeWAOStub } from '/assets/harness-lib/wao-stub.js';
    import { FAKE, FAKE_API, FAKE_TIMELINE } from './fake-data.js';
    const params = new URLSearchParams(location.search);
    // ?state=empty|error — boundary baselines (test/ui-shot.sh). error uses
    // the SDK's real offline copy (网络请求失败：…) so the shot matches what a
    // server-down browser actually shows.
    const state = params.get('state');
    const fake = state === 'empty' ? { agents: [], timeline: [] }
      : state === 'error' ? {
        agents: [], agentsError: '网络请求失败：Failed to fetch',
        timeline: [], timelineError: '网络请求失败：Failed to fetch',
      }
        : { agents: FAKE.agents, timeline: FAKE_TIMELINE, api: FAKE_API };
    const stub = makeWAOStub(fake);
    const index = await import('./index.js'); // registers all six pages via the collector
    const wanted = params.get('page');
    const page = [index.default, ...stub.pages].find((p) => p.id === wanted) ?? index.default;
    stub.render(page, document.getElementById('root'));
  </script>
</body>
</html>
