<!doctype html>
<!-- ui-workbench harness (截图工作流, v2 导航收敛为三页): ?page=overview
     (default, 总览) renders AI 操作引导卡 + 办公室 3D 内嵌 + 状态卡片切换 +
     最近活动; also robots / settings. robots 页 ?select=new&step=N (1-5) 直达
     创建向导第 N 步, ?select=<botId>&tab=session|logs|tools|settings 直达详情
     tab——向导第 3 步配发装备 / 工具 tab / 设置 tab 的基线用. settings 页
     ?section=ai (AI 操作: MCP 端点/三家 CLI 配置/工具清单/skill 文件/连通性,
     &ai-tools=1 展开工具清单) 或 ?section=system 直达系统信息；内嵌的资产科
     ?view=equip[&bot=<id>] 深链仍然有效（装备台基线）。总览的 3D 由
     overview.js 按需同源 import /api/ui/ui-office3d/index.js（真控制台同
     路径，harness 无需额外接线）。/api/mcp 与 /api/mcp/skill 的假数据在
     fake-data.js（mcp-gateway 插件提供真数据）。
     ?state=empty (no bots) / ?state=error (服务断联的 fetch 失败文案)
     swap the fake data for those boundary states — test/ui-shot.sh 截空态/
     错误态基线用. Swap fake-data.js entries for the state you want to
     screenshot (empty ledger, offline bot, failed plugin, push error...),
     then:
       chrome --headless=new --disable-gpu --screenshot=overview-light.png \
         --window-size=1280,800 http://127.0.0.1:8792/api/ui/ui-workbench/harness.html
       chrome ... --screenshot=robots-light.png \
         http://127.0.0.1:8792/api/ui/ui-workbench/harness.html?page=robots
     and again with --force-dark-mode for the dark pair of each page. -->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>harness · ui-workbench</title>
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body>
  <div id="root"></div>
  <script src="/vendor/react.umd.js"></script>
  <script src="/vendor/react-dom.umd.js"></script>
  <script type="module">
    import { makeWAOStub } from '/assets/harness-lib/wao-stub.js';
    import { FAKE, FAKE_API, FAKE_TIMELINE } from './fake-data.js';
    const params = new URLSearchParams(location.search);
    // ?state=empty|error — boundary baselines (test/ui-shot.sh). error uses
    // the SDK's real offline copy (网络请求失败：…) so the shot matches what a
    // server-down browser actually shows.
    const state = params.get('state');
    const fake = state === 'empty' ? { agents: [], timeline: [] }
      : state === 'error' ? {
        agents: [], agentsError: '网络请求失败：Failed to fetch',
        timeline: [], timelineError: '网络请求失败：Failed to fetch',
      }
        : { agents: FAKE.agents, timeline: FAKE_TIMELINE, api: FAKE_API };
    const stub = makeWAOStub(fake);
    const index = await import('./index.js'); // registers the three pages via the collector
    const wanted = params.get('page');
    const page = [index.default, ...stub.pages].find((p) => p.id === wanted) ?? index.default;
    stub.render(page, document.getElementById('root'));
  </script>
</body>
</html>
