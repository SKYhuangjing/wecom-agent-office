<!doctype html>
<!-- ui-office3d harness (Magpie): FAKE agents. Query knobs:
       ?dim=2d|iso|3d     view mode (default iso)
       ?scene=office|…    3D theme id
       ?quality=low|medium|high
       ?state=empty|error boundary baselines
     Screenshots (example):
       CHROME="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
       "$CHROME" --headless=new --disable-gpu --window-size=1280,800 \
         --screenshot=office-iso.png \
         http://127.0.0.1:8792/api/ui/ui-office3d/harness.html
       …/harness.html?dim=2d  ·  …/harness.html?dim=3d&scene=office -->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>harness · ui-office3d</title>
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body>
  <div id="root"></div>
  <script src="/vendor/react.umd.js"></script>
  <script src="/vendor/react-dom.umd.js"></script>
  <script type="module">
    import { makeWAOStub } from '/assets/harness-lib/wao-stub.js';
    import { FAKE, FAKE_TIMELINE } from './fake-data.js';
    const state = new URLSearchParams(location.search).get('state');
    const fake = state === 'empty' ? { agents: [], timeline: [] }
      : state === 'error' ? {
        agents: [], agentsError: '网络请求失败：Failed to fetch',
        timeline: [], timelineError: '网络请求失败：Failed to fetch',
      }
        : { agents: FAKE.agents, timeline: FAKE_TIMELINE };
    const stub = makeWAOStub(fake);
    const office = (await import('./index.js')).default;
    stub.render(office, document.getElementById('root'));
  </script>
</body>
</html>
