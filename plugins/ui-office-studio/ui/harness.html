<!doctype html>
<!-- ui-office-studio harness: FAKE agents + timeline. ?state=empty|error -->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>harness · ui-office-studio</title>
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body>
  <div id="root"></div>
  <script src="/vendor/react.umd.js"></script>
  <script src="/vendor/react-dom.umd.js"></script>
  <script type="module">
    import { makeWAOStub } from '/assets/harness-lib/wao-stub.js';
    import { FAKE, FAKE_TIMELINE } from './fake-data.js';
    const state = new URLSearchParams(location.search).get('state');
    const fake = state === 'empty' ? { agents: [], timeline: [] }
      : state === 'error' ? {
        agents: [], agentsError: '网络请求失败：Failed to fetch',
        timeline: [], timelineError: '网络请求失败：Failed to fetch',
      }
        : { agents: FAKE.agents, timeline: FAKE_TIMELINE };
    const stub = makeWAOStub(fake);
    const page = (await import('./index.js')).default;
    stub.render(page, document.getElementById('root'));
  </script>
</body>
</html>
