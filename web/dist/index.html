<!doctype html>
<!-- WAO console (DESIGN §9). Hand-written on purpose: it only loads the
     vendored React UMD (the ONE instance shared by shell + page plugins),
     the committed shell bundle and its stylesheet. Everything else is
     page-plugin modules fetched at runtime from /api/ui/<id>/. -->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WAO Console</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- 工程血统字型：拉丁/数字用 IBM Plex（Sans + Mono 等宽做时钟/ID/指标），
       中文回退系统字。media=print onload 技巧使字体不阻塞首屏；CDN 不可达
       时整栈回退系统字，无破坏。 -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body>
  <div id="root"></div>
  <script src="/vendor/react.umd.js"></script>
  <script src="/vendor/react-dom.umd.js"></script>
  <script src="/assets/app.js"></script>
</body>
</html>
