<!doctype html>
<!-- WAO console (DESIGN §9). Hand-written on purpose: it only loads the
     vendored React UMD (the ONE instance shared by shell + page plugins),
     the committed shell bundle and its stylesheet. Everything else is
     page-plugin modules fetched at runtime from /api/ui/<id>/. -->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WAO Console</title>
  <!-- 工程血统字型：拉丁/数字用 IBM Plex（Sans + Mono 等宽做时钟/ID/指标），
       中文回退系统字。本地托管（OFL 开源，latin 子集 7 个 woff2）——
       不依赖外网 CDN，慢网/断网时品牌字体不再静默消失（走查 L1）。 -->
  <link rel="stylesheet" href="/assets/plex.css">
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body>
  <div id="root"></div>
  <script src="/vendor/react.umd.js"></script>
  <script src="/vendor/react-dom.umd.js"></script>
  <script src="/assets/app.js"></script>
</body>
</html>
